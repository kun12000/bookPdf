<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pembaca Buku PDF</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
 --bg1:#f5f7fb;--bg2:#e4e9f2;--ink:#1c2533;--muted:#667085;--accent:#3d6be0;--onacc:#fff;--paper:#fff;--glass:rgba(255,255,255,.9);--panel:rgba(255,255,255,.98);
 --btn:rgba(28,37,51,.06);--btnb:rgba(28,37,51,.12);--btnh:rgba(28,37,51,.12);--line:rgba(28,37,51,.12);--field:rgba(28,37,51,.05);--track:rgba(28,37,51,.15);--scrim:rgba(236,240,247,.85);--shadow:0 20px 50px rgba(30,45,80,.18);--lamp:rgba(255,255,255,.9)}
body[data-mode="sepia"]{--bg1:#f3ead8;--bg2:#e3d6bb;--ink:#3a2e20;--muted:#7d6b53;--accent:#b0602a;--paper:#f1e4c6;--glass:rgba(251,245,233,.92);--panel:rgba(251,245,233,.98);--btn:rgba(58,46,32,.07);--btnb:rgba(58,46,32,.14);--btnh:rgba(58,46,32,.14);--line:rgba(58,46,32,.14);--field:rgba(58,46,32,.06);--track:rgba(58,46,32,.18);--scrim:rgba(243,234,216,.88);--shadow:0 20px 50px rgba(80,55,20,.2);--lamp:rgba(255,248,232,.8)}
body[data-mode="night"]{color-scheme:dark;--bg1:#141922;--bg2:#0a0d12;--ink:#e8edf5;--muted:#9aa6b8;--accent:#7aa7ff;--onacc:#0b1220;--paper:#16181d;--glass:rgba(22,28,38,.92);--panel:rgba(18,23,31,.98);--btn:rgba(255,255,255,.08);--btnb:rgba(255,255,255,.14);--btnh:rgba(255,255,255,.16);--line:rgba(255,255,255,.12);--field:rgba(255,255,255,.07);--track:rgba(255,255,255,.2);--scrim:rgba(6,8,12,.8);--shadow:0 20px 50px rgba(0,0,0,.5);--lamp:rgba(122,167,255,.08)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font-family:Lora,Georgia,"Times New Roman",serif;color:var(--ink);display:flex;flex-direction:column;overflow:hidden;
 background:radial-gradient(ellipse 80% 60% at 50% 35%,var(--lamp),transparent 70%),linear-gradient(var(--bg1),var(--bg2));transition:background .4s,color .3s}
button{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--btnb);border-radius:999px;padding:7px 16px;cursor:pointer;transition:background .2s,transform .15s}
button:hover:not(:disabled){background:var(--btnh)}button:active:not(:disabled){transform:scale(.95)}
button:disabled{opacity:.3;cursor:default}
button.main{background:var(--accent);color:var(--onacc);border:0;font-weight:600}button.main:hover{background:var(--accent)!important;filter:brightness(1.1)}
header,footer{position:relative;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 14px;transition:opacity .5s}
header h1{font-size:1rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400;letter-spacing:.04em;opacity:.9}
body.idle header,body.idle footer,body.idle .arrow{opacity:0;pointer-events:none}
#stage{flex:1;min-height:0;display:flex;position:relative;overflow:hidden;touch-action:pan-y}#stage.zoomed{overflow:auto;touch-action:pan-x pan-y}
#book{position:relative;margin:auto;flex:none;perspective:2800px;transition:transform .7s ease;display:none;filter:drop-shadow(0 18px 20px rgba(20,30,50,.3))}
.page,.leaf{position:absolute;top:0;height:100%}
.page{width:50%}.page.left{left:0}.page.right{left:50%}
.leaf{left:50%;width:50%;transform-origin:left center;transform-style:preserve-3d;display:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--paper)}
.face.back{transform:rotateY(180deg)}
.page.has{background:var(--paper)}
.face img,.page img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;transition:filter .3s}
body[data-mode="sepia"] img{filter:sepia(.5) brightness(.96) contrast(.95)}
body[data-mode="night"] img{filter:contrast(1.7) brightness(.95) invert(.9) hue-rotate(180deg) brightness(1.12)}
.face::after,.page.has::after{content:"";position:absolute;inset:0;pointer-events:none}
.page.left.has::after,.face.back::after{background:linear-gradient(to left,rgba(0,0,0,.13),rgba(0,0,0,.03) 4%,transparent 9%)}
.page.right.has::after,.face.front::after{background:linear-gradient(to right,rgba(0,0,0,.13),rgba(0,0,0,.03) 4%,transparent 9%)}
.page.right.has{border-radius:0 5px 5px 0;box-shadow:1px 0 0 #eceff4,2px 0 0 #c5ccd8,3px 0 0 #eceff4,4px 0 0 #aab3c2}
.page.left.has{border-radius:5px 0 0 5px;box-shadow:-1px 0 0 #eceff4,-2px 0 0 #c5ccd8,-3px 0 0 #eceff4,-4px 0 0 #aab3c2}
#book.single .page.left{display:none}
#book.single .page.right,#book.single .leaf{left:0;width:100%}
.arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:4;width:48px;height:48px;padding:0;font-size:1.8rem;line-height:1;background:var(--glass);backdrop-filter:blur(6px);transition:opacity .5s,background .2s}
.arrow.l{left:12px}.arrow.r{right:12px}
@media (max-width:760px){.arrow{display:none}}
footer{flex-direction:column;gap:6px;padding-bottom:12px}
.bar{display:flex;align-items:center;gap:12px;width:min(640px,92vw);color:var(--muted);font-size:.88rem}
#info{white-space:nowrap;min-width:9.5em;text-align:center}
#slider{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:5px;outline:none;cursor:pointer;
 background:linear-gradient(to right,var(--accent) var(--p,0%),var(--track) var(--p,0%))}
#slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--panel)}
#slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--panel)}
#welcome{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:8;overflow:auto}body.hasdoc #welcome{background:var(--scrim)}
.drop{max-width:440px;width:100%;text-align:center;border:1.5px dashed var(--accent);border-radius:22px;padding:40px 26px;background:var(--glass);backdrop-filter:blur(8px);box-shadow:var(--shadow);transition:background .2s,transform .2s}
.drop.over{background:var(--btnh);transform:scale(1.02)}
.drop .ico{font-size:3.4rem}
.drop h2{font-weight:600;font-size:1.5rem;margin:8px 0 0}
.drop p{color:var(--muted);margin:10px 0 22px;line-height:1.6;font-size:.95rem}
.hint{margin-top:16px;font-size:.8rem;color:var(--muted);opacity:.8}
#msg{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:var(--glass);padding:7px 16px;border-radius:20px;font-size:.85rem;display:none;z-index:6}
#fsBtn{display:none}
#toc,#srch{position:fixed;top:0;right:0;bottom:0;width:min(320px,85vw);z-index:9;background:var(--panel);backdrop-filter:blur(8px);transform:translateX(105%);transition:transform .3s;display:flex;flex-direction:column;border-left:1px solid var(--line)}
#toc.open,#srch.open{transform:none}
#toc .th,#srch .th{display:flex;justify-content:space-between;align-items:center;padding:14px}
#tocList{overflow:auto;padding:0 8px 24px}
#toc a,#srch a{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:.92rem}
#toc a:hover,#srch a:hover{background:var(--btn)}
#toc a span,#srch a span{color:var(--muted);flex:none}
.rec{display:flex;justify-content:space-between;gap:10px;text-align:left;width:100%;margin-top:8px;border-radius:12px;padding:10px 14px}
.rec b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rec small{color:var(--muted);flex:none}
#recent h3{font-weight:400;font-size:.85rem;color:var(--muted);margin:22px 0 0;text-align:left}
header h1{min-width:0}
body:not(.hasdoc) #homeBtn,body:not(.hasdoc) #tocBtn,body:not(.hasdoc) #recBtn,body:not(.hasdoc) #zo,body:not(.hasdoc) #zv,body:not(.hasdoc) #zi,body:not(.hasdoc) #srchBtn,body:not(.hasdoc) #markBtn{display:none}
#toc h3{font-weight:400;font-size:.8rem;color:var(--muted);margin:2px 14px 4px}
body:not(.hasdoc) .zg{display:none}
#more,.zg{display:contents}#moreBtn{display:none}
@media (max-width:760px){
header{flex-wrap:nowrap;gap:6px;padding:6px 10px}
header h1{font-size:.9rem}
header button{padding:7px 12px}
.lbl{display:none}
#moreBtn{display:inline-block}
#more{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 54px);right:10px;z-index:10;flex-direction:column;gap:8px;min-width:210px;padding:12px;background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
#more.open{display:flex}
#more .lbl{display:inline}
#more button{text-align:left;border-radius:12px}
body:not(.hasdoc) .zg{display:none}
.zg{display:flex;gap:6px}.zg button{flex:1;text-align:center}
}
</style>
</head>
<body data-mode="light">
<header>
 <button id="homeBtn" title="Kembali ke beranda" aria-label="Beranda">🏠<span class="lbl"> Beranda</span></button>
 <h1 id="title">Pembaca Buku PDF</h1>
 <button id="tocBtn" title="Daftar isi" aria-label="Daftar isi">☰<span class="lbl"> Isi</span></button>
 <button id="srchBtn" title="Cari teks" aria-label="Cari teks">🔍</button>
 <button id="markBtn" title="Penanda halaman" aria-label="Penanda halaman">🔖</button>
 <button id="moreBtn" title="Menu lainnya" aria-label="Menu lainnya">⋯</button>
 <div id="more">
  <button id="recBtn" title="Berkas terakhir">🕘<span class="lbl"> Riwayat</span></button>
  <div class="zg"><button id="zo" title="Perkecil">−</button><button id="zv" title="Reset zoom">100%</button><button id="zi" title="Perbesar">+</button></div>
  <button id="modeBtn" title="Ganti tema kertas">☀ Terang</button>
  <button id="fsBtn" title="Layar penuh">⛶</button>
  <button id="openBtn" class="main">Buka PDF</button>
 </div>
 <input type="file" id="file" accept="application/pdf" hidden>
</header>
<main id="stage">
 <div id="welcome"><div class="drop" id="drop">
  <div class="ico">📖</div>
  <h2 style="font-weight:normal;margin:8px 0 0">Baca PDF seperti buku</h2>
  <p>Seret berkas PDF ke sini atau pilih dari perangkat. Berkas dibuka langsung di browser dan tidak diunggah ke mana pun.</p>
  <button id="pick" class="main">Pilih berkas PDF</button>
  <div class="hint">Navigasi: klik halaman, geser, atau tombol panah ← →</div>
  <div id="recent"></div>
  <button id="closeW" style="display:none;margin-top:16px">Tutup</button>
 </div></div>
 <div id="book">
  <div class="page left" id="pl"></div>
  <div class="page right" id="pr"></div>
  <div class="leaf" id="leaf"><div class="face front" id="lf"></div><div class="face back" id="lb"></div></div>
 </div>
 <button class="arrow l" id="al" aria-label="Sebelumnya">‹</button>
 <button class="arrow r" id="ar" aria-label="Berikutnya">›</button>
 <div id="msg"></div>
</main>
<footer>
 <div class="bar">
  <button id="prev" disabled aria-label="Halaman sebelumnya">‹</button>
  <input type="range" id="slider" min="1" max="1" value="1" aria-label="Geser halaman">
  <button id="next" disabled aria-label="Halaman berikutnya">›</button>
 </div>
 <div class="bar" style="justify-content:center"><span id="info">–</span><input id="jump" type="number" min="1" placeholder="Ke hal…" aria-label="Lompat ke halaman" style="width:6em;background:var(--field);border:1px solid var(--btnb);color:var(--ink);border-radius:999px;padding:5px;text-align:center;font:inherit"></div>
</footer>
<aside id="toc"><div class="th"><b>Isi &amp; penanda</b><button id="tocX">×</button></div><div id="markList"></div><div id="tocList"></div></aside>
<aside id="srch"><div class="th"><b>Cari teks</b><button id="srchX">×</button></div>
<div style="padding:0 14px 8px;display:flex;gap:6px"><input id="q" placeholder="Ketik kata lalu Enter" style="flex:1;min-width:0;background:var(--field);border:1px solid var(--btnb);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit"><button id="qGo" class="main">Cari</button></div>
<div style="padding:0 14px 8px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.85rem"><span id="qStat"></span><button id="qClr" style="padding:3px 10px;font-size:.8rem">Hapus sorotan</button></div>
<div id="qList" style="overflow:auto;padding:0 8px 24px"></div></aside>
<script src="pdf.min.js"></script>
<script>
const $=id=>document.getElementById(id);
pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';
let curPage=1,hl='',texts=[],z=1,curKey='',doc=null,n=0,ratio=.707,pw=0,ph=0,single=false,cur=0,busy=false,cache=new Map();
const book=$('book'),pl=$('pl'),pr=$('pr'),leaf=$('leaf'),lf=$('lf'),lb=$('lb');

function msg(t,ms=0){const m=$('msg');m.textContent=t;m.style.display=t?'block':'none';if(ms)setTimeout(()=>m.style.display='none',ms)}
const K=()=>single?n:Math.floor(n/2)+1;
function sp(k){if(single)return[null,k];return k===0?[null,0]:[2*k-1,2*k<n?2*k:null]}
function ok(i){return i!=null&&i<n}

async function img(i){
  if(!ok(i))return null;
  if(cache.has(i))return cache.get(i);
  const p=(async()=>{
    const page=await doc.getPage(i+1);
    const v0=page.getViewport({scale:1});
    const dpr=Math.min(Math.max(window.devicePixelRatio||1,1.75),3);
    const s=Math.min(pw*dpr,3200)/v0.width;
    const v=page.getViewport({scale:s});
    const c=document.createElement('canvas');c.width=v.width;c.height=v.height;
    await page.render({canvasContext:c.getContext('2d'),viewport:v}).promise;if(hl)await markHl(page,v,c);
    return c.toDataURL('image/jpeg',.9);
  })();
  cache.set(i,p);return p;
}
async function fill(el,i,isFace){
  el.innerHTML='';
  if(!isFace){el.classList.toggle('has',ok(i))}
  if(!ok(i))return;
  const src=await img(i);const im=new Image();im.src=src;im.draggable=false;el.appendChild(im);
}
function shift(k){
  if(single||z>1){book.style.transform='';return}
  const[l,r]=sp(k);
  book.style.transform=!ok(l)?`translateX(${-pw/2}px)`:!ok(r)?`translateX(${pw/2}px)`:'';
}
function label(k){
  const[l,r]=sp(k);const a=[l,r].filter(ok).map(x=>x+1);
  $('info').textContent=`Halaman ${a.join('–')} dari ${n}`;
  $('prev').disabled=k<=0;$('next').disabled=k>=K()-1;curPage=Math.max(...a,1);savePos(curPage);updMark();
  const sl=$('slider');sl.max=n;sl.value=Math.max(...a,1);sl.style.setProperty('--p',n>1?((Math.max(...a,1)-1)/(n-1)*100)+'%':'100%');
}
async function render(k){
  cur=Math.max(0,Math.min(K()-1,k));
  const[l,r]=sp(cur);
  shift(cur);
  await Promise.all([fill(pl,l),fill(pr,r)]);
  label(cur);
}
async function flip(dir){
  if(busy||!doc)return;
  const k1=cur+dir;if(k1<0||k1>=K())return;
  busy=true;
  const[l0,r0]=sp(cur),[l1,r1]=sp(k1);
  await Promise.all([l0,r0,l1,r1].map(img));
  if(dir>0){
    await Promise.all([fill(pl,l0),fill(pr,r1),fill(lf,r0,1),fill(lb,l1,1)]);
  }else{
    await Promise.all([fill(pl,l1),fill(pr,r0),fill(lf,r1,1),fill(lb,l0,1)]);
  }
  lb.style.background=ok(dir>0?l1:l0)?'':'var(--paper)';
  leaf.style.transition='none';leaf.style.display='block';
  leaf.style.transform=dir>0?'rotateY(0deg)':'rotateY(-180deg)';
  void leaf.offsetWidth;
  leaf.style.transition='transform .9s cubic-bezier(.45,.05,.25,1)';
  shift(k1);
  leaf.style.transform=dir>0?'rotateY(-180deg)':'rotateY(0deg)';
  setTimeout(async()=>{
    cur=k1;
    await Promise.all([fill(pl,l1),fill(pr,r1)]);
    leaf.style.display='none';
    label(cur);busy=false;
  },930);
}
function layout(){
  const st=$('stage');
  const aw=st.clientWidth-8,ah=st.clientHeight-8;
  single=aw<760;
  const cols=single?1:2;
  ph=Math.min(ah,aw/(cols*ratio),2400)*z;pw=ph*ratio;$('stage').classList.toggle('zoomed',z>1);
  book.style.width=cols*pw+'px';book.style.height=ph+'px';
  book.classList.toggle('single',single);
}
async function openFile(f){
  if(!f)return;
  if(f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name)){msg('Berkas harus berformat PDF',2500);return}
  msg('Membuka buku…');
  try{
    const data=new Uint8Array(await f.arrayBuffer());
    doc=await pdfjsLib.getDocument({data}).promise;
    n=doc.numPages;cache.clear();texts=[];hl='';qTok++;$('qList').innerHTML='';$('qStat').textContent='';curKey='';const key=f.name+'|'+f.size,saved=posMap()[key]||1;
    const p1=await doc.getPage(1);const v=p1.getViewport({scale:1});ratio=v.width/v.height;
    $('title').textContent=f.name.replace(/\.pdf$/i,'');
    showWelcome(false);document.body.classList.add('hasdoc');if(!histOn){try{history.pushState({b:1},'');histOn=true}catch(e){}}book.style.display='block';z=1;$('zv').textContent='100%';
    $('jump').max=n;
    layout();curKey=key;await render(pageToK(Math.min(n,saved)-1));msg('');if(saved>1)msg('Dilanjutkan dari halaman '+Math.min(n,saved),2500);wake();loadToc();saveRecent(f,key,n);
  }catch(e){console.error(e);msg('Gagal membuka PDF (berkas rusak atau dilindungi sandi)',4000)}
}
const pageToK=p0=>single?p0:(p0===0?0:Math.floor((p0+1)/2));
function posMap(){try{return JSON.parse(localStorage.getItem('bukuPos')||'{}')}catch(e){return{}}}
function savePos(p){if(!curKey)return;const m=posMap();m[curKey]=p;try{localStorage.setItem('bukuPos',JSON.stringify(m))}catch(e){}}
async function setZoom(v){v=Math.max(1,Math.min(3,Math.round(v*4)/4));if(v===z||!doc||busy)return;z=v;$('zv').textContent=Math.round(z*100)+'%';layout();cache.clear();await render(cur);const S=$('stage');if(z>1){S.scrollLeft=(S.scrollWidth-S.clientWidth)/2;S.scrollTop=(S.scrollHeight-S.clientHeight)/2}}
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('bukuDB',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'key'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function recents(){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('files').objectStore('files').getAll();q.onsuccess=()=>res(q.result.sort((a,b)=>b.t-a.t));q.onerror=()=>res([])})}catch(e){return[]}}
async function saveRecent(f,key,pages){try{if(f.size>120e6)return;const blob=new Blob([await f.arrayBuffer()],{type:'application/pdf'});const d=await idb();const tx=d.transaction('files','readwrite'),os=tx.objectStore('files');os.put({key,name:f.name,size:f.size,n:pages,t:Date.now(),file:blob});await new Promise(r=>tx.oncomplete=r);const all=await recents();if(all.length>5){const t2=d.transaction('files','readwrite');all.slice(5).forEach(x=>t2.objectStore('files').delete(x.key))}}catch(e){}}
async function delRecent(key){
  try{const d=await idb();const tx=d.transaction('files','readwrite');const os=tx.objectStore('files');key?os.delete(key):os.clear();await new Promise(r=>tx.oncomplete=r)}catch(e){}
  const m=posMap();if(key)delete m[key];else Object.keys(m).forEach(k=>delete m[k]);
  try{localStorage.setItem('bukuPos',JSON.stringify(m))}catch(e){}
  try{const mm=marksAll();key?delete mm[key]:Object.keys(mm).forEach(k=>delete mm[k]);localStorage.setItem('bukuMarks',JSON.stringify(mm))}catch(e){}
}
async function renderRecent(){
  const box=$('recent');box.innerHTML='';const all=await recents();if(!all.length)return;
  const h=document.createElement('h3');h.textContent='Terakhir dibaca';box.appendChild(h);
  const m=posMap();
  all.forEach(x=>{const b=document.createElement('button');b.className='rec';
    const t=document.createElement('b');t.textContent=x.name.replace(/\.pdf$/i,'');
    const g=document.createElement('small');g.textContent='hal '+(m[x.key]||1)+(x.n?' / '+x.n:'');
    b.append(t,g);b.onclick=()=>openFile(new File([x.file],x.name,{type:'application/pdf'}));
    const del=document.createElement('button');del.textContent='✕';del.title='Hapus dari riwayat';del.setAttribute('aria-label','Hapus dari riwayat');
    del.style.cssText='margin-top:8px;border-radius:12px;padding:10px 14px;flex:none';
    del.onclick=async()=>{await delRecent(x.key);renderRecent()};
    b.style.flex='1';b.style.minWidth='0';
    const row=document.createElement('div');row.style.cssText='display:flex;gap:6px';row.append(b,del);box.appendChild(row)});
  const ca=document.createElement('button');ca.textContent='Hapus semua riwayat';
  ca.style.cssText='margin-top:14px;background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px';
  ca.onclick=async()=>{await delRecent();renderRecent()};box.appendChild(ca)
}
function showWelcome(v){$('welcome').style.display=v?'flex':'none';$('closeW').style.display=doc?'inline-block':'none';if(v)renderRecent()}
let histOn=false,qTok=0;
function marksAll(){try{return JSON.parse(localStorage.getItem('bukuMarks')||'{}')}catch(e){return{}}}
function marks(){return marksAll()[curKey]||[]}
function setMarks(a){const m=marksAll();m[curKey]=a;try{localStorage.setItem('bukuMarks',JSON.stringify(m))}catch(e){}}
function updMark(){if(!curKey)return;$('markBtn').textContent=marks().includes(curPage)?'★':'🔖';renderMarks()}
function renderMarks(){
  const box=$('markList');box.innerHTML='';const a=marks().slice().sort((x,y)=>x-y);if(!a.length)return;
  const h=document.createElement('h3');h.textContent='Penanda';box.appendChild(h);
  a.forEach(p=>{const r=document.createElement('a');const d=document.createElement('div');d.textContent='🔖 Halaman '+p;
    const x=document.createElement('span');x.textContent='✕';x.title='Hapus penanda';
    x.onclick=e=>{e.stopPropagation();setMarks(marks().filter(q=>q!==p));updMark()};
    r.append(d,x);r.onclick=()=>{jumpTo(p);closeToc()};box.appendChild(r)})
}
function toggleMark(){
  if(!doc)return;const has=marks().includes(curPage);
  setMarks(has?marks().filter(x=>x!==curPage):[...marks(),curPage]);updMark();
  msg(has?'Penanda dihapus':'Penanda ditambahkan (hal '+curPage+')',1500)
}
async function pageText(i){if(texts[i]!=null)return texts[i];const pg=await doc.getPage(i+1);const tc=await pg.getTextContent();return texts[i]=tc.items.map(x=>x.str).join(' ')}
async function markHl(page,v,c){
  try{const tc=await page.getTextContent();const g=c.getContext('2d');const lc=hl.toLowerCase();g.fillStyle='rgba(255,214,10,.5)';
    for(const it of tc.items){const t=it.str,low=t.toLowerCase();if(!t.length)continue;let pos=low.indexOf(lc);
      const m=pdfjsLib.Util.transform(v.transform,it.transform),w=it.width*v.scale,h=(it.height||Math.abs(m[3]))*v.scale;
      while(pos>=0){g.fillRect(m[4]+w*pos/t.length,m[5]-h*.9,Math.max(4,w*lc.length/t.length),h*1.15);pos=low.indexOf(lc,pos+lc.length)}}
  }catch(e){}
}
function closeSrch(){$('srch').classList.remove('open')}
function showHl(p){cache.clear();const t=pageToK(p-1);if(t!==cur&&Math.abs(t-cur)===1)flip(t>cur?1:-1);else render(t)}
async function runSearch(){
  const term=$('q').value.trim(),L=$('qList');L.innerHTML='';hl='';
  if(!doc||term.length<2){$('qStat').textContent=term?'Minimal 2 huruf.':'';return}
  const my=++qTok,lc=term.toLowerCase();let found=0;
  for(let i=0;i<n;i++){
    if(my!==qTok)return;
    $('qStat').textContent='Mencari… hal '+(i+1)+' / '+n;
    const t=await pageText(i),low=t.toLowerCase();let pos=low.indexOf(lc),c=0;
    while(pos>=0&&c<3&&found<300){
      const a=document.createElement('a'),d=document.createElement('div'),g=document.createElement('span'),pg=i+1;
      d.textContent=(pos>30?'…':'')+t.slice(Math.max(0,pos-30),pos+term.length+40).replace(/\s+/g,' ')+'…';
      g.textContent='hal '+pg;a.append(d,g);a.onclick=()=>{hl=term;closeSrch();showHl(pg)};L.appendChild(a);
      found++;c++;pos=low.indexOf(lc,pos+lc.length)}
    if(found>=300)break}
  if(my===qTok)$('qStat').textContent=found?found+' hasil'+(found>=300?' (dibatasi 300)':''):'Tidak ditemukan. PDF hasil pindaian (gambar) tidak bisa dicari.'
}
function goHome(){
  if(!doc)return;
  doc=null;n=0;curKey='';cache.clear();z=1;$('zv').textContent='100%';clearTimeout(it);
  book.style.display='none';$('stage').classList.remove('zoomed');closeToc();closeSrch();
  document.body.classList.remove('hasdoc','idle');$('title').textContent='Pembaca Buku PDF';
  $('info').textContent='–';$('prev').disabled=true;$('next').disabled=true;
  pl.innerHTML='';pr.innerHTML='';$('tocList').innerHTML='';
  showWelcome(true);
}
function backHome(){
  if(histOn){try{history.back()}catch(e){}setTimeout(()=>{if(doc)goHome()},350)}else goHome();
}
addEventListener('popstate',()=>{histOn=false;goHome()});
function closeToc(){$('toc').classList.remove('open')}
async function loadToc(){
  const L=$('tocList');L.innerHTML='';const my=doc;let ol=null;
  try{ol=await my.getOutline()}catch(e){}
  if(!ol||!ol.length){L.innerHTML='<p style="padding:10px;color:var(--muted)">PDF ini tidak punya daftar isi.</p>';return}
  async function walk(items,d){for(const it of items){
    const a=document.createElement('a');a.style.paddingLeft=(10+d*16)+'px';
    const t=document.createElement('div');t.textContent=it.title;const g=document.createElement('span');a.append(t,g);L.appendChild(a);
    (async()=>{try{let dest=it.dest;if(typeof dest==='string')dest=await my.getDestination(dest);
      const idx=typeof dest[0]==='object'?await my.getPageIndex(dest[0]):dest[0];
      a.onclick=()=>{jumpTo(idx+1);closeToc()};g.textContent=idx+1}catch(e){}})();
    if(it.items&&it.items.length)await walk(it.items,d+1)}}
  await walk(ol,0)
}
function jumpTo(p){
  if(!doc||isNaN(p))return;
  p=Math.max(1,Math.min(n,p))-1;
  const k=single?p:(p===0?0:Math.ceil(p/2));
  const kk=single?p:(p===0?0:Math.floor((p+1)/2));
  const t=kk;
  if(t===cur)return;
  if(Math.abs(t-cur)===1)flip(t>cur?1:-1);else render(t);
}
$('openBtn').onclick=$('pick').onclick=()=>$('file').click();
$('file').onchange=e=>openFile(e.target.files[0]);
$('fsBtn').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
$('next').onclick=$('ar').onclick=()=>flip(1);$('prev').onclick=$('al').onclick=()=>flip(-1);
$('slider').onchange=e=>jumpTo(parseInt(e.target.value));
$('slider').oninput=e=>{const v=+e.target.value;e.target.style.setProperty('--p',(n>1?(v-1)/(n-1)*100:100)+'%');$('info').textContent='Halaman '+v+' dari '+n};
const modes=[['light','☀ Terang'],['sepia','☕ Sepia'],['night','☾ Malam']];let mi=0;
function setMode(i){mi=i;document.body.dataset.mode=modes[i][0];$('modeBtn').textContent=modes[i][1];try{localStorage.setItem('bukuMode',i)}catch(e){}}
try{const m=parseInt(localStorage.getItem('bukuMode'));if(m>=0&&m<3)setMode(m)}catch(e){}
$('homeBtn').onclick=backHome;
$('moreBtn').onclick=e=>{e.stopPropagation();$('more').classList.toggle('open')};
$('more').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!['zo','zv','zi','modeBtn'].includes(b.id))$('more').classList.remove('open')});
document.addEventListener('click',e=>{if(!e.target.closest('#more,#moreBtn'))$('more').classList.remove('open')});
$('tocBtn').onclick=()=>{closeSrch();renderMarks();$('toc').classList.toggle('open')};
$('markBtn').onclick=toggleMark;
$('srchBtn').onclick=()=>{closeToc();const o=$('srch').classList.toggle('open');if(o)setTimeout(()=>$('q').focus(),300)};
$('srchX').onclick=closeSrch;$('qGo').onclick=runSearch;
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});
$('qClr').onclick=()=>{hl='';if(doc){cache.clear();render(cur)}};$('tocX').onclick=closeToc;
$('recBtn').onclick=()=>showWelcome(true);$('closeW').onclick=()=>showWelcome(false);
$('zo').onclick=()=>setZoom(z-.5);$('zi').onclick=()=>setZoom(z+.5);$('zv').onclick=()=>setZoom(1);
renderRecent();
$('modeBtn').onclick=()=>setMode((mi+1)%3);
let it;function wake(){document.body.classList.remove('idle');clearTimeout(it);if(doc)it=setTimeout(()=>document.body.classList.add('idle'),3500)}
['pointermove','pointerdown','keydown','touchstart'].forEach(t=>addEventListener(t,wake,{passive:true}));
$('jump').addEventListener('keydown',e=>{if(e.key==='Enter'){jumpTo(parseInt(e.target.value));e.target.value='';e.target.blur()}});
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')flip(1);
  else if(e.key==='ArrowLeft'||e.key==='PageUp')flip(-1);
  else if(e.key==='Home'&&doc)render(0);
  else if(e.key==='End'&&doc)render(K()-1);
});
let sx=null,moved=false;
const st=$('stage');
st.addEventListener('pointerdown',e=>{sx=e.clientX;moved=false});
st.addEventListener('pointerup',e=>{
  if(sx==null||!doc||z>1)return;
  const dx=e.clientX-sx;sx=null;
  if(Math.abs(dx)>50){flip(dx<0?1:-1);return}
  if(e.target.closest('#book')){
    const r=book.getBoundingClientRect();
    flip(e.clientX<r.left+r.width/2&&!single?-1:(single&&e.clientX<r.left+r.width*.3?-1:1));
  }
});
(function(){let d0=0,f=1,on=false;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  st.addEventListener('touchstart',e=>{if(e.touches.length===2&&doc&&!busy){on=true;d0=dist(e.touches);f=1;sx=null}},{passive:true});
  st.addEventListener('touchmove',e=>{if(!on||e.touches.length!==2)return;e.preventDefault();f=Math.max(1/z,Math.min(3/z,dist(e.touches)/d0));book.style.scale=f},{passive:false});
  const end=()=>{if(!on)return;on=false;book.style.scale='';const nz=z*f;f=1;setZoom(nz)};
  st.addEventListener('touchend',e=>{if(e.touches.length<2)end()});st.addEventListener('touchcancel',end);
})();
const drop=$('drop');
['dragenter','dragover'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over')}));
document.addEventListener('drop',e=>openFile(e.dataTransfer.files[0]));
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(async()=>{
  if(!doc||busy)return;
  const was=single,[l]=sp(cur);const page=ok(l)?l:sp(cur)[1];
  layout();cache.clear();
  const t=single?page:(page===0?0:Math.floor((page+1)/2));
  await render(t);
},250)});
</script>
</body>
</html>
